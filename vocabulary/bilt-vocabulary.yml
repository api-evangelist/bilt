  - term: Integration models
    definition: 'Every model uses the same Checkout integration: sessions, SDK rendering, webhooks, and payment methods, including points. What
      changes is who processes the payment. | &nbsp; | Bilt-processed | Gateway | |---|---|---| | Who processes | Bilt | Your processor accounts
      | | Where funds settle | Bilt settles to you | Directly to your accounts | | Your processor''s reporting | — | Keeps working as today |'
    tags:
