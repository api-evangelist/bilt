    source: openapi/_original/checkout-sdk.yml
  - term: Gateway mode
    definition: 'Keep your processor relationships. In gateway mode, Bilt Checkout sends payment instructions to your existing processor accounts,
      so payments are created on your accounts, settle to your accounts, and show up in your processor''s reporting as usual. Your integration
      is the same as any Bilt Checkout merchant: sessions, the SDK, and webhooks. What''s different is setup: during onboarding we connect Bi'
    tags:
    - Resource Group
    source: openapi/_original/checkout-sdk.yml
  - term: Choosing an acquirer
    definition: By default, card payments go to the acquirer you designate during onboarding. If you have merchant accounts with more than one
      acquirer, Bilt can route across them using rules you set, such as failover, cost, or approval rates, so routing decisions stay with you.
      Routing is configured for your account during onboarding. Email checkout@bilt.com to set it up.
    tags:
    - Resource Group
    source: openapi/_original/checkout-sdk.yml
  - term: One-time payments
    definition: Open a checkout session that renders Bilt-hosted checkout in the Checkout SDK. The customer confirms the payment themselves; the
      outcome arrives as a `checkout.session.*` webhook.
    tags:
    - Resource Group
    source: openapi/_original/checkout-sdk.yml
  - term: Headless payments
    definition: Charge a customer's current default Bilt payment method with no Bilt UI, for subscriptions, autopay, or other off-session payments.
      The outcome arrives as a `payment.*` webhook.
    tags:
    - Resource Group
    source: openapi/_original/checkout-sdk.yml
  - term: Default payment method
    definition: Read-only lookup of a customer's current default payment-method summary for display and pre-flight checks. Bilt resolves the default
      again at charge time, so it may change between lookup and payment.
    tags:
    - Resource Group
    source: openapi/_original/checkout-sdk.yml
  - term: Payment webhooks
    definition: Standard Webhooks-signed, at-least-once payment and checkout-session events delivered from Bilt to your backend. See **Introduction
      › Webhooks** for signing, verification, and retry behaviour.
    tags:
    - Resource Group
    source: openapi/_original/checkout-sdk.yml
