  - term: PaymentAmounts
    definition: Split of the order total between eligible Bilt credits and the customer's card. `subtotalCents = creditsAppliedCents + chargedAmountCents`.
      On a `202` acceptance `creditsAppliedCents` is `0`; the final split is on the `payment.succeeded` webhook. A synchronous `200` response
      carries the final split.
